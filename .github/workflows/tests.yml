name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  watcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watcher
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Unit tests
        run: uv run pytest

  widget-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: PulseModel logic tests
        run: node widget/tests/pulse-model.test.js
