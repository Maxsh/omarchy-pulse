[project]
name = "omarchy-pulse-watcher"
version = "0.2.1"
description = "Keyboard and mouse activity watcher for Omarchy: counts input events and ships them to ActivityWatch"
requires-python = ">=3.11"
dependencies = ["evdev>=1.7"]

[project.scripts]
pulse-watcher = "pulse_watcher.__main__:main"
pulse-term-watcher = "pulse_watcher.term.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.uv]
# Keep the isolated build environment reproducible: `uv sync --locked` covers
# the dependency lock, but not the build-time dependencies of the project
# itself — this constrains the backend the reviewed commit builds with
# (marketplace review #15375).
build-constraint-dependencies = ["hatchling==1.33.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse_watcher"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
